name: uptime-ping
# Every 5 min, ask the THATCHED uptime Worker (on Cloudflare) to check our public links from outside.
# The Worker keeps state and sends alerts; this job is only the clock. Key lives in repo secret RUN_KEY.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          curl -fsS -m 120 -X POST -H "x-run-key: ${{ secrets.RUN_KEY }}" \
            https://thatched-site-uptime.picchess.workers.dev/run
